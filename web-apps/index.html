<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Kasukuzu Portfolio の Webアプリ一覧ページ"
    />
    <title>Webアプリ | Kasukuzu Portfolio</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body class="subpage">
    <div class="page-shell">
      <header class="site-header">
        <div class="container header-inner">
          <a class="site-logo" href="../">Kasukuzu Portfolio</a>
          <nav class="site-nav" aria-label="グローバルナビゲーション">
            <a href="../">Home</a>
            <a href="./" aria-current="page">Web Apps</a>
            <a href="../games/">Games</a>
            <a href="../#contact">Contact</a>
          </nav>
        </div>
      </header>

      <main>
        <section class="page-hero-section">
          <div class="container page-hero-header">
            <a class="back-link" href="../">← トップページに戻る</a>
            <div class="page-hero-panel">
              <p class="section-kicker">Collection</p>
              <h1>Webアプリ</h1>
              <p class="page-description">
                制作したWebアプリや便利ツールをまとめています。
              </p>
            </div>
          </div>
        </section>

        <section class="content-section page-content-section">
          <div class="container">
            <div class="works-grid">
              <article class="work-card">
                <div class="card-accent"></div>
                <div class="card-content">
                  <p class="card-tag">Web App</p>
                  <h3>日本ルーレット</h3>
                  <p>
                    日本の都道府県から旅行先をランダムに決めるWebアプリ
                  </p>
                </div>
                <span class="card-button" aria-label="準備中">準備中</span>
              </article>
            </div>

            <div class="page-actions">
              <a class="secondary-link" href="../">トップページに戻る</a>
            </div>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <div class="container">
          <p>&copy; 2026 Kasukuzu Portfolio</p>
        </div>
      </footer>
    </div>
  </body>
</html>
