<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Kasukuzu Portfolio のゲーム一覧ページ"
    />
    <title>ゲーム | Kasukuzu Portfolio</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body class="subpage">
    <div class="page-shell">
      <header class="site-header">
        <div class="container header-inner">
          <a class="site-logo" href="../">Kasukuzu Portfolio</a>
          <nav class="site-nav" aria-label="グローバルナビゲーション">
            <a href="../">Home</a>
            <a href="../web-apps/">Web Apps</a>
            <a href="./" aria-current="page">Games</a>
            <a href="../#contact">Contact</a>
          </nav>
        </div>
      </header>

      <main>
        <section class="page-hero-section">
          <div class="container page-hero-header">
            <a class="back-link" href="../">← トップページに戻る</a>
            <div class="page-hero-panel">
              <p class="section-kicker">Collection</p>
              <h1>ゲーム</h1>
              <p class="page-description">
                Unityなどで制作したゲーム作品をまとめています。
              </p>
            </div>
          </div>
        </section>

        <section class="content-section page-content-section">
          <div class="container">
            <div class="works-grid">
              <article class="work-card">
                <div class="card-accent"></div>
                <div class="card-content">
                  <p class="card-tag">Game</p>
                  <h3>Quick Fire Arena</h3>
                  <p>ブラウザで遊べるWeb FPSゲームです。</p>
                </div>
                <a
                  class="card-button"
                  href="https://quick-fire-arena-client.vercel.app"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  ゲームを開く
                </a>
              </article>

              <article class="work-card">
                <div class="card-accent"></div>
                <div class="card-content">
                  <p class="card-tag">itch.io</p>
                  <h3>itch.io 公開作品</h3>
                  <p>制作した3つのゲーム作品を公開しているitch.ioのページです。</p>
                </div>
                <a
                  class="card-button"
                  href="https://karasawao0.itch.io/"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  itch.ioを見る
                </a>
              </article>
            </div>

            <div class="page-actions">
              <a class="secondary-link" href="../">トップページに戻る</a>
            </div>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <div class="container">
          <p>&copy; 2026 Kasukuzu Portfolio</p>
        </div>
      </footer>
    </div>
  </body>
</html>
